[package]
name = "symveil-core"
version = "0.1.0"
edition = "2021"
authors = ["Magnus Malm <magnusmalm@protonmail.com>"]
description = "Free-tier secret masking library for the SymVeil local proxy"
license = "Apache-2.0"
repository = "https://github.com/magnusmalm/symveil"
homepage = "https://symveil.dev"
readme = "README.md"
keywords = ["redaction", "secrets", "proxy", "privacy", "llm"]
categories = ["network-programming", "development-tools", "text-processing"]
# Library source only. LICENSE is a copy of the repository Apache-2.0 text.
# Unit tests live in src/ and use documented example values such as the AWS
# sample access key id. There is no identifier masker.
# Cargo ignores `exclude` when `include` is set; `include` is the package.
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
    "Cargo.toml",
]
exclude = [
    "tests/**/*",
    "tests/fixtures/**/*",
]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.7"
bytes = "1"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
