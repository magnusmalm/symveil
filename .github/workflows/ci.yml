name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: shellcheck launch scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -s sh -x scripts/symveil-claude scripts/symveil-grok scripts/symveil-common.sh scripts/real-client-dotenv.sh
      - name: learn crate has no network dependencies
        run: |
          set -eu
          cargo tree -p symveil-learn --prefix none --edges normal,build > /tmp/symveil-learn-tree.txt
          if grep -E '^(reqwest|hyper|hyper-util|ureq|tokio|axum|h2|mio|socket2|native-tls|rustls|tokio-rustls|tungstenite)( |$)' /tmp/symveil-learn-tree.txt; then
            echo "symveil-learn pulled a network crate" >&2
            exit 1
          fi
      - name: test
        run: cargo test --workspace --locked -- --skip leak_measurement
      # Fails while a gated canary still reaches the mock. The Markdown
      # report in the log is the measurement. Do not skip the test to make it green.
      - name: leak test
        run: cargo test --test leak_harness --locked leak_measurement -- --nocapture

  # Timing only. A slow or noisy run must not fail the build.
  bench:
    name: bench (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: quick bench
        run: scripts/bench.sh --quick
